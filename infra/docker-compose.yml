services:

  mysql:
    image: mysql:8.4
    ports:
      - "3306:3306"
    env_file:
      - ../.env

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    env_file:
      - ../.env
